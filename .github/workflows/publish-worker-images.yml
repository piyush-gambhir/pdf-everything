name: Publish worker images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    tags:
      - 'workers-v*'
    paths:
      - 'workers/**'
      - '.github/workflows/workers-ci.yml'
      - '.github/workflows/publish-worker-images.yml'

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: worker-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pdf-everything-pdf-worker

jobs:
  verify:
    name: Verify pdf-worker
    uses: ./.github/workflows/workers-ci.yml

  publish-standard:
    name: Publish pdf-worker
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=match,pattern=workers-v(.*),group=1

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: workers/pdf-worker
          file: workers/pdf-worker/deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pdf-worker-standard
          cache-to: type=gha,mode=max,scope=pdf-worker-standard

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  publish-lambda:
    name: Publish pdf-worker Lambda
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}-lambda
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=match,pattern=workers-v(.*),group=1

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: workers/pdf-worker
          file: workers/pdf-worker/deploy/lambda/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pdf-worker-lambda
          cache-to: type=gha,mode=max,scope=pdf-worker-lambda

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}-lambda
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
