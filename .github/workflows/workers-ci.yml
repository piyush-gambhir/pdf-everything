name: Worker CI

on:
  workflow_call:
  pull_request:
    paths:
      - 'workers/**'
      - '.github/workflows/workers-ci.yml'
      - '.github/workflows/publish-worker-images.yml'

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.worker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: html-to-pdf
            port: 8010
            payload: '{"html":"<h1>Container smoke test</h1>"}'
          - worker: markdown-to-pdf
            port: 8011
            payload: '{"markdown":"# Container smoke test"}'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: workers/${{ matrix.worker }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: workers/${{ matrix.worker }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: workers/${{ matrix.worker }}
        run: pnpm build

      - name: Check formatting
        working-directory: workers/${{ matrix.worker }}
        run: pnpm format:check

      - name: Run tests
        working-directory: workers/${{ matrix.worker }}
        run: pnpm test

      - name: Build standard image
        run: |
          docker build \
            --file "workers/${{ matrix.worker }}/deploy/docker/Dockerfile" \
            --tag "${{ matrix.worker }}:ci" \
            "workers/${{ matrix.worker }}"

      - name: Smoke-test standard image
        env:
          WORKER: ${{ matrix.worker }}
          PORT: ${{ matrix.port }}
          PAYLOAD: ${{ matrix.payload }}
        run: |
          docker run --detach --name "${WORKER}-ci" \
            --publish "127.0.0.1:${PORT}:${PORT}" \
            "${WORKER}:ci"

          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/ready" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "${WORKER}-ci"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent \
            --request POST \
            --header "content-type: application/json" \
            --data "$PAYLOAD" \
            "http://127.0.0.1:${PORT}/v1/render" \
            --output /tmp/worker-smoke.pdf

          test "$(head -c 5 /tmp/worker-smoke.pdf)" = "%PDF-"
          docker rm --force "${WORKER}-ci"

      - name: Build Lambda image
        run: |
          docker build \
            --file "workers/${{ matrix.worker }}/deploy/lambda/Dockerfile" \
            --tag "${{ matrix.worker }}-lambda:ci" \
            "workers/${{ matrix.worker }}"
