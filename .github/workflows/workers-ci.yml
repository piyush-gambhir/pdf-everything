name: Runtime CI

on:
  workflow_call:
  pull_request:
    paths:
      - 'workers/**'
      - 'backend/**'
      - 'types/**'
      - 'scripts/verify-stack.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/workers-ci.yml'
      - '.github/workflows/publish-worker-images.yml'

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-stack:
    name: Verify all operations through the gateway
    # The x64 runner includes Chrome for the compiled-stack check.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            workers/pdf-worker/pnpm-lock.yaml

      - name: Install and build the API and workers
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pdf-everything/types build
          pnpm --filter @pdf-everything/backend build
          pnpm --filter @pdf-everything/pdf-core-worker build
          pnpm --dir workers/pdf-worker install --frozen-lockfile
          pnpm --dir workers/pdf-worker build

      - name: Verify all 19 operations and file lifecycle
        run: pnpm verify:stack

  verify-gateway:
    name: Verify Nest API gateway
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: |
          pnpm --filter @pdf-everything/types build
          pnpm --filter @pdf-everything/backend build
          pnpm --filter @pdf-everything/backend test

      - name: Build image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag pdf-everything-api:ci \
            .

      - name: Smoke-test image
        run: |
          cleanup() {
            docker rm --force pdf-everything-api-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name pdf-everything-api-ci \
            --publish 127.0.0.1:3001:3001 \
            pdf-everything-api:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs pdf-everything-api-ci
              exit 1
            fi
            sleep 1
          done

  verify-core:
    name: Verify pdf-core-worker
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm --filter @pdf-everything/types build
          pnpm --filter @pdf-everything/pdf-core-worker build

      - name: Run tests
        run: pnpm --filter @pdf-everything/pdf-core-worker test

      - name: Build image
        run: |
          docker build \
            --file workers/pdf-core-worker/Dockerfile \
            --tag pdf-core-worker:ci \
            .

      - name: Smoke-test image
        run: |
          cleanup() {
            docker rm --force pdf-core-worker-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name pdf-core-worker-ci \
            --publish 127.0.0.1:8020:8020 \
            pdf-core-worker:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8020/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs pdf-core-worker-ci
              exit 1
            fi
            sleep 1
          done

          test "$(
            curl --silent http://127.0.0.1:8020/v1/operations \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).operations.length)))"
          )" = "17"

  verify:
    name: Verify Chromium pdf-worker
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: pnpm
          cache-dependency-path: workers/pdf-worker/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: workers/pdf-worker
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: workers/pdf-worker
        run: pnpm build

      - name: Check formatting
        working-directory: workers/pdf-worker
        run: pnpm format:check

      - name: Run tests
        working-directory: workers/pdf-worker
        run: pnpm test

      - name: Build standard image
        run: |
          docker build \
            --file workers/pdf-worker/deploy/docker/Dockerfile \
            --tag pdf-worker:ci \
            workers/pdf-worker

      # The arm64 runner has no Chrome, so the real-Chromium tests run inside
      # the image just built, against the Chromium and fonts it ships.
      - name: Run real-Chromium integration tests in the image
        run: sh workers/pdf-worker/scripts/integration-in-docker.sh pdf-worker:ci

      - name: Smoke-test both operations
        run: |
          cleanup() {
            docker rm --force pdf-worker-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name pdf-worker-ci \
            --publish 127.0.0.1:8010:8010 \
            pdf-worker:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs pdf-worker-ci
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent \
            --request POST \
            --header "content-type: application/json" \
            --data '{"html":"<h1>HTML container smoke test</h1>"}' \
            http://127.0.0.1:8010/v1/render/html \
            --output /tmp/html-smoke.pdf

          curl --fail --silent \
            --request POST \
            --header "content-type: application/json" \
            --data '{"markdown":"# Markdown container smoke test"}' \
            http://127.0.0.1:8010/v1/render/markdown \
            --output /tmp/markdown-smoke.pdf

          test "$(head -c 5 /tmp/html-smoke.pdf)" = "%PDF-"
          test "$(head -c 5 /tmp/markdown-smoke.pdf)" = "%PDF-"

      - name: Authenticate AWS public registry pulls
        if: vars.AWS_PUBLIC_ECR_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLIC_ECR_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          mask-aws-account-id: true

      - name: Log in to ECR Public
        if: vars.AWS_PUBLIC_ECR_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build Lambda image
        run: |
          docker build \
            --file workers/pdf-worker/deploy/lambda/Dockerfile \
            --tag pdf-worker-lambda:ci \
            workers/pdf-worker
